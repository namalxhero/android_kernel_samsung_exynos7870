name: Build Dark su (manager app + KernelSU kernel for J7 Prime)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "H-KERNEL branch (h-kernel_permissive or h-kernel_enforcing)"
        default: "h-kernel_permissive"
        required: true
      debug:
        description: "Enable KernelSU debug logging (dmesg)"
        type: boolean
        default: true

jobs:
  manager:
    runs-on: ubuntu-22.04
    outputs:
      cert_size: ${{ steps.cert.outputs.size }}
      cert_hash: ${{ steps.cert.outputs.hash }}
    steps:
      - name: Checkout repo (for darksu.jks and boot.img)
        uses: actions/checkout@v4

      - name: Clone KernelSU manager source (same tag as the kernel driver)
        run: |
          git clone -b v3.2.2-10-legacy https://github.com/rsuntk/KernelSU kmgr

      - name: Rename app to Dark su
        run: |
          sed -i 's#<string name="app_name" translatable="false">KernelSU</string>#<string name="app_name" translatable="false">Dark su</string>#' kmgr/manager/app/src/main/res/values/strings.xml
          grep -n app_name kmgr/manager/app/src/main/res/values/strings.xml

      - name: Signing key (use darksu.jks from repo, or create one)
        id: cert
        env:
          KS_PASS: darksu-local-key
        run: |
          if [ ! -f darksu.jks ]; then
            echo "darksu.jks not found in repo, creating a new key"
            keytool -genkeypair -keystore darksu.jks -alias darksu -keyalg RSA -keysize 2048 -validity 36500 -storepass "$KS_PASS" -keypass "$KS_PASS" -dname "CN=DarkSU, O=DarkSU, C=LK"
          fi
          cp darksu.jks kmgr/manager/darksu.jks
          keytool -exportcert -alias darksu -keystore darksu.jks -storepass "$KS_PASS" > cert.der
          echo "size=$(stat -c%s cert.der)" >> $GITHUB_OUTPUT
          echo "hash=$(sha256sum cert.der | cut -d' ' -f1)" >> $GITHUB_OUTPUT
          {
            echo KEYSTORE_FILE=darksu.jks
            echo KEYSTORE_PASSWORD=$KS_PASS
            echo KEY_ALIAS=darksu
            echo KEY_PASSWORD=$KS_PASS
          } >> kmgr/manager/gradle.properties

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Android NDK r29
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29

      - name: Build ksud (arm64 + armv7)
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          rustup update stable
          rustup target add aarch64-linux-android armv7-linux-androideabi
          cd kmgr
          for T in aarch64-linux-android armv7-linux-androideabi; do
            (
              source .github/scripts/setup-rust-build.sh $T 26
              cargo build --target $T --release --manifest-path ./userspace/ksud/Cargo.toml
            )
          done
          mkdir -p manager/app/src/main/jniLibs/arm64-v8a manager/app/src/main/jniLibs/armeabi-v7a
          cp target/aarch64-linux-android/release/ksud manager/app/src/main/jniLibs/arm64-v8a/libksud.so
          cp target/armv7-linux-androideabi/release/ksud manager/app/src/main/jniLibs/armeabi-v7a/libksud.so

      - name: Build manager APK
        working-directory: kmgr/manager
        run: |
          chmod +x gradlew
          ./gradlew clean assembleRelease --stacktrace
          ls -la app/build/outputs/apk/release/

      - name: Upload Dark su APK
        uses: actions/upload-artifact@v4
        with:
          name: DarkSu-manager
          path: kmgr/manager/app/build/outputs/apk/release/*.apk

      - name: Upload signing key (save it as darksu.jks in your repo)
        uses: actions/upload-artifact@v4
        with:
          name: darksu-keystore
          path: darksu.jks

  kernel:
    needs: manager
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repo (for boot.img)
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev ccache zip git curl xz-utils python3

      - name: Get GCC 4.9 toolchain (AOSP)
        run: |
          git clone --depth=1 -b lineage-19.1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 $HOME/gcc
          $HOME/gcc/bin/aarch64-linux-android-gcc --version | head -1

      - name: Clone H-KERNEL source
        run: |
          git clone --depth=1 -b "${{ inputs.branch }}" https://github.com/samsungexynos7870/android_kernel_samsung_exynos7870 ksrc

      - name: Add KernelSU (rsuntk legacy tag, supports 3.18)
        working-directory: ksrc
        env:
          CERT_SIZE: ${{ needs.manager.outputs.cert_size }}
          CERT_HASH: ${{ needs.manager.outputs.cert_hash }}
          DEBUG_ON: ${{ inputs.debug }}
        run: |
          git clone --depth=1 -b v3.2.2-10-legacy https://github.com/rsuntk/KernelSU KernelSU
          rm -rf KernelSU/.git
          ln -sfn ../KernelSU/kernel drivers/kernelsu
          echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          sed -i '$i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          printf 'CONFIG_KSU=y\n# CONFIG_KSU_LSM_HOOKS is not set\n# CONFIG_KSU_DEBUG is not set\n' >> arch/arm64/configs/exynos7870-on7xelte_defconfig
          sed -i 's/d_is_reg(/d_is_file(/' KernelSU/kernel/runtime/ksud.c
          sed -i "/} apk_sign_keys\[\] = {/a\    { ${CERT_SIZE}, \"${CERT_HASH}\" }, // DARKSU" KernelSU/kernel/manager/apk_sign.c
          grep -n DARKSU KernelSU/kernel/manager/apk_sign.c
          if [ "$DEBUG_ON" = "true" ]; then sed -i 's/^# CONFIG_KSU_DEBUG is not set/CONFIG_KSU_DEBUG=y/' arch/arm64/configs/exynos7870-on7xelte_defconfig; fi
          sed -i 's/long ret = (long)ns_get_path(&ns_path, pid1_task, &mntns_operations);/long ret = -ENOSYS; ns_path.mnt = NULL; ns_path.dentry = NULL;/' KernelSU/kernel/infra/su_mount_ns.c

      - name: Apply KernelSU manual hooks (3.18)
        working-directory: ksrc
        run: |
          cat > ksu_hooks.py <<'PYEOF'
          #!/usr/bin/env python3
          # KernelSU manual hooks for Linux 3.18 (Exynos7870 H-KERNEL). Run from the kernel source root.
          import sys

          def edit(path, anchor, new, after=False):
              s = open(path).read()
              if new in s:
                  print("[skip] already patched:", path)
                  return
              if s.count(anchor) != 1:
                  sys.exit("[ERROR] anchor found %d times in %s:\n%s" % (s.count(anchor), path, anchor))
              i = s.index(anchor) + (len(anchor) if after else 0)
              open(path, "w").write(s[:i] + new + s[i:])
              print("[ok]", path)

          # 1) fs/exec.c : execve (su redirect + ksud boot hook)
          edit("fs/exec.c", "static int do_execve_common(struct filename *filename,",
           "extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);\n\n")
          edit("fs/exec.c", "\tif (IS_ERR(filename))\n\t\treturn PTR_ERR(filename);\n\n\t/*\n\t * We move the actual failure",
           "\t{\n\t\tint ksu_fd = AT_FDCWD, ksu_flags = 0;\n\t\tif (!IS_ERR(filename))\n\t\t\tksu_handle_execveat(&ksu_fd, &filename, &argv, &envp, &ksu_flags);\n\t}\n\n")

          # 2) fs/open.c : faccessat
          edit("fs/open.c", "SYSCALL_DEFINE3(faccessat, int, dfd, const char __user *, filename, int, mode)",
           "extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode, int *flags);\n\n")
          edit("fs/open.c", "\tif (mode & ~S_IRWXO)\t/* where's F_OK, X_OK, W_OK, R_OK? */",
           "\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n\n")

          # 3) fs/stat.c : stat + fstat (init.rc size)
          edit("fs/stat.c", "int vfs_fstat(unsigned int fd, struct kstat *stat)",
           "extern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);\nextern void ksu_handle_vfs_fstat(int fd, loff_t *kstat_size_ptr);\n\n")
          edit("fs/stat.c", "\t\terror = vfs_getattr(&f.file->f_path, stat);\n",
           "\t\tif (!error)\n\t\t\tksu_handle_vfs_fstat(fd, &stat->size);\n", after=True)
          edit("fs/stat.c", "\tif ((flag & ~(AT_SYMLINK_NOFOLLOW | AT_NO_AUTOMOUNT |\n\t\t      AT_EMPTY_PATH)) != 0)\n\t\tgoto out;\n\n\tif (!(flag & AT_SYMLINK_NOFOLLOW))",
           "\tksu_handle_stat(&dfd, &filename, &flag);\n\n")

          # 4) fs/read_write.c : vfs_read (init.rc injection)
          edit("fs/read_write.c", "ssize_t vfs_read(struct file *file, char __user *buf, size_t count, loff_t *pos)\n{",
           "extern bool ksu_vfs_read_hook __read_mostly;\nextern int ksu_handle_vfs_read(struct file **file_ptr, char __user **buf_ptr, size_t *count_ptr, loff_t **pos);\n\n")
          edit("fs/read_write.c", "ssize_t vfs_read(struct file *file, char __user *buf, size_t count, loff_t *pos)\n{\n\tssize_t ret;\n\n",
           "\tif (unlikely(ksu_vfs_read_hook))\n\t\tksu_handle_vfs_read(&file, &buf, &count, &pos);\n\n", after=True)

          # 5) kernel/reboot.c : manager <-> kernel supercall
          edit("kernel/reboot.c", "SYSCALL_DEFINE4(reboot, int, magic1, int, magic2, unsigned int, cmd,",
           "extern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg);\n\n")
          edit("kernel/reboot.c", "\t/* We only trust the superuser with rebooting the system. */",
           "\tksu_handle_sys_reboot(magic1, magic2, cmd, &arg);\n\n")

          # 6) security/security.c : setuid + key_permission (3.18 has no LSM_HOOK_INIT)
          edit("security/security.c", "int security_task_fix_setuid(struct cred *new, const struct cred *old,",
           "extern int ksu_task_fix_setuid(struct cred *new, const struct cred *old, int flags);\n\n")
          edit("security/security.c", "\treturn security_ops->task_fix_setuid(new, old, flags);",
           "\tksu_task_fix_setuid(new, old, flags);\n")
          edit("security/security.c", "int security_key_permission(key_ref_t key_ref,",
           "extern int ksu_key_permission(key_ref_t key_ref, const struct cred *cred, unsigned perm);\n\n")
          edit("security/security.c", "\treturn security_ops->key_permission(key_ref, cred, perm);",
           "\tksu_key_permission(key_ref, cred, perm);\n")
          print("ALL HOOKS APPLIED")
          PYEOF
          python3 ksu_hooks.py

      - name: Build kernel
        working-directory: ksrc
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=$HOME/gcc/bin/aarch64-linux-android-
          export ANDROID_MAJOR_VERSION=q
          export ANDROID_PLATFORM_VERSION=10
          sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' scripts/dtc/dtc-lexer.lex.c_shipped
          make O=out exynos7870-on7xelte_defconfig
          grep KSU out/.config
          make O=out -j$(nproc) KCFLAGS="-Wno-error" Image 2>&1 | tail -40
          ls -la out/arch/arm64/boot/Image

      - name: Package flashable zip (AnyKernel3)
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 ak3
          cd ak3
          rm -rf .git .github README.md modules patch ramdisk
          cp ../ksrc/out/arch/arm64/boot/Image Image
          cat > anykernel.sh <<'AKEOF'
          ### AnyKernel3 Ramdisk Mod Script
          properties() { '
          kernel.string=H-KERNEL V1.0 + KernelSU (J7 Prime)
          do.devicecheck=1
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=on7xelte
          device.name2=on7xeltedd
          device.name3=on7xeltekx
          device.name4=SM-G610F
          device.name5=SM-G610M
          supported.versions=
          supported.patchlevels=
          '; }
          block=/dev/block/mmcblk0p10;
          is_slot_device=0;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;
          . tools/ak3-core.sh;
          dump_boot;
          write_boot;
          AKEOF
          zip -r9 ../KSU-H-KERNEL-on7xelte.zip * -x .git
          cp Image ../Image

      - name: Repack boot.img with new kernel
        run: |
          set -e
          [ -f boot.img ] || { echo "boot.img not found in repo, skipping"; exit 0; }
          git clone --depth=1 https://github.com/osm0sis/mkbootimg mk
          make -C mk CFLAGS="-Wno-error -O2"
          mkdir -p unp
          ./mk/unpackbootimg -i boot.img -o unp
          P=unp/boot.img
          RD=$(ls ${P}-ramdisk ${P}-ramdisk.* 2>/dev/null | head -1)
          ARGS="--kernel Image --ramdisk $RD --cmdline \"$(cat ${P}-cmdline)\" --base $(cat ${P}-base) --pagesize $(cat ${P}-pagesize) --kernel_offset $(cat ${P}-kernel_offset) --ramdisk_offset $(cat ${P}-ramdisk_offset) --second_offset $(cat ${P}-second_offset) --tags_offset $(cat ${P}-tags_offset) --board \"$(cat ${P}-board)\""
          [ -s ${P}-dt ] && ARGS="$ARGS --dt ${P}-dt"
          eval ./mk/mkbootimg $ARGS -o new-boot.img
          if tail -c 16 boot.img | grep -q SEANDROIDENFORCE; then printf 'SEANDROIDENFORCE' >> new-boot.img; fi
          ls -la boot.img new-boot.img

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: KSU-H-KERNEL-on7xelte
          path: |
            KSU-H-KERNEL-on7xelte.zip
            new-boot.img
            Image
